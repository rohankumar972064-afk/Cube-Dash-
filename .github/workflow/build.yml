
name: Build Cube Dash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q Cube_Dash_Final_AdMob_Package.zip -d project
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          cd "$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cube-Dash-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
