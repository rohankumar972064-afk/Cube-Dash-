
name: Build Cube Dash APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q Cube_Dash_Final_AdMob_Package.zip -d project

      - name: Find project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name settings.gradle | head -1)")"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cube-Dash-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
